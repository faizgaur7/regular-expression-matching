<!DOCTYPE html>
<html>
<head>
        <title>N Queens Problem</title>

        <style>
            body{
                font-family: Arial;
                text-align: center;
                background: #f2f2f2;;
                padding: 30px;

            }
            input {
                padding: 10px;
                width: 80px;
                font-size: 16px;

            }

            button{
                padding: 10px 20px;
                margin-left: 10px;
                font-size: 16px;
                cursor: pointer;
            }

            .solution {
                display: inline-block;
                margin: 20px;

            }

            .board {
                border: 2px solid black;

            }

            .row{
                display: flex;

            }

            .cell {
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px;

            }


</style>
</head>

<body>
       <h1>N-Queens Problem</h1>
       <p>ENter the value of N:</p>
       <input type="number" id="n" value="4" min="1" max="8">

       <button onclick="solveQueens()">solve</button>
           <div id="result"></div>


           <script>

                 function solveQueens() {
                    let n = Number(document.getElementById("n").value);
                    if (n < 1 || n > 8) {
                        document.getElementById("result").innerHTML = 
                        "<h3>Please enter a number from 1 too 8.</h3>";
                        return;
                    }
                    let board = [];
                    let solutions =[];
                    
                    for (let i  = 0; i < n; i++) {
                        board.push(new Array(n).fill(false));
                    }

                    function isSafe(row, col) {
                        for (let i = 0; i < row; i++){
                            if (board[i][col]){
                                return false;
                            }
                        }
                    
                    for (let i = row - 1, j = col - 1;
                    i >= 0 && j >= 0;
                    i--, j--) {
                        if (board[i][j]) {
                            return false;
                        }
                    }
                      return true;
                    }

                    function findQueens(row) {
                        if (row == n) {
                            let copy = [];
                            for (let i=0; i < n; i++) {
                                copy.push(board[i].slice());
                            }
                            solutions.push(copy);
                            return;
                        }
                        for (let col = 0; col < n; col++) {
                            if (isSafe(row, col)) {
                                board[row][col] = true;
                                findQueens(row + 1);
                                board[row][col] = false;
                            }
                        }
                    }

                    findQueens(0);
                    let result = "";

                    result += "<h2>Total solutions:"
                            + solutions.length
                            +"</h2>";
                    
                            for (let s = 0; s < solutions.length; s++) {
                                result += "<div class='solution'>";
                                    result += "<h3>Solution"
                                            + (s + 1)
                                            + "</h3>";
                                            result += "<div class='board'>";

                                            for (let row = 0; row < n; row++) {
                                                result += "<div class='row'>";
                                                for (let col = 0; col < n; col++) {
                                                    let squarecolor;
                                                    if ((row + col) % 2 == 0) {
                                                        squarecolor = "#eeeeee";
                                                      } else {
                                                        squarecolor = "#555555";

                                                      }

                                                      let Queen = "";
                                                      if (solutions[s][row][col]) {
                                                        Queen = "♛";

                                                      }

                                                      result +=
                                                      "<div class='cell' style='background:"
                                                      + squarecolor
                                                      + ";'>"
                                                      +Queen
                                                      +"</div>";

                                                }

                                                result += "</div>";
                                            }
                                            result += "</div>";
                                            result += "</div>";

                            }
                                 document.getElementById("result") .innerHTML = result;

                 }

                </script>

</body>
</html>
